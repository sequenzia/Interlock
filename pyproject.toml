[project]
name = "interlock"
version = "0.1.0"
description = "Runtime safety shield demo: SB3 DQN in highway-env, judged by Jev against plain-English rules"
requires-python = ">=3.12,<3.13"
dependencies = [
    "highway-env>=1.12,<1.13",
    "gymnasium>=1.0",
    "stable-baselines3>=2.9,<3",
    "torch>=2.8",
    "numpy",
    "typesafe-sdk",
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "matplotlib",
]

[project.scripts]
interlock = "backend.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The package is backend/ at the repo root, not src/interlock/. uv sync installs it
# editable so the interlock script resolves; nothing is ever built for distribution.
module-name = "backend"
module-root = ""
source-exclude = ["backend/.env", "backend/logs"]
wheel-exclude = ["backend/.env", "backend/logs"]

[tool.uv.sources]
# The container runs on Linux without a GPU: take torch from the CPU-only index
# there so the image skips the CUDA libraries. macOS keeps the PyPI wheel.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "ANN", "RUF"]
ignore = ["ANN401", "E501"]  # ruff format owns layout; E501 only fires on unbreakable strings

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
